<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>

  <!-- 播放按钮外圈 -->
  <circle cx="150" cy="170" r="52" fill="rgba(74,108,247,0.25)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <!-- 播放按钮内圈 -->
  <circle cx="150" cy="170" r="38" fill="rgba(255,255,255,0.15)"/>
  <!-- 播放三角 -->
  <polygon points="140,150 140,190 180,170" fill="#ffffff" opacity="0.9"/>

  <!-- 品牌文字 -->
  <text x="150" y="260" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="20" font-family="Arial">微澜</text>
  <text x="150" y="285" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="13" font-family="Arial">VidWave</text>
</svg>